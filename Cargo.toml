[package]
name = "ts_grammar_ls"
version = "0.1.0"
edition = "2024"
authors      = [ "Will Lillis <will.lillis24@gmail.com>"]
categories   = [ "command-line-utilities", "development-tools" ]
keywords     = [ "tree-sitter", "lsp" ]
description = "An LSP implementation for Tree-sitter's tsg files"
repository = "https://www.github.com/WillLillis/ts_grammar_ls"
readme = "README.md"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ts_grammar_ls"
path = "src/main.rs"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
dbg_macro = "deny"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"

cast-possible-truncation = "allow"
multiple_crate_versions = "allow"

[dependencies]
clap = { version = "4", features = ["derive"] }
dashmap = "6.1"
etcetera = "0.8"
toml = "0.8"
dunce = "1.0"
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
    "time",
    "process",
] }
tokio-util = "0.7"
tower-lsp = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter-generate = { path = "../tree-sitter/crates/generate", features = [
    "nativedsl",
] }
rustc-hash = "2.1.2"
memchr = "2.8.0"

[dev-dependencies]
futures-util = "0.3.32"
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
